<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Every page on eagleadams86.github.io shares one browser origin with the
       other apps' saved data, so even a redirect stub carries a CSP: only its
       own files and inline script/style may run, nothing loads from anywhere but
       the favicon. `style-src 'self'` is what admits theme.css below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>PAPTrack has moved</title>
  <link rel="icon" href="favicon.ico">
  <link rel="canonical" href="https://eagleadams86.github.io/paptrack/">
  <meta http-equiv="refresh" content="0; url=https://eagleadams86.github.io/paptrack/">
  <script>location.replace("https://eagleadams86.github.io/paptrack/");</script>
  <!-- The shared palette, same as the landing page beside it. A stub is on the
       screen for a fraction of a second, but it is on the shared origin and it
       is public, so it takes the family's colours rather than its own. -->
  <link rel="stylesheet" href="theme.css">
  <style>
    body{font:var(--fw-normal) var(--fs-base)/var(--lh-base) var(--font-sans);
         background:var(--bg);color:var(--text-primary);
         display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;text-align:center;padding:1.5rem}
    a{color:var(--accent)}
    a:focus-visible{outline:2px solid var(--focus-border);outline-offset:2px}
  </style>
</head>
<body>
  <div>
    <h1>PAPTrack Has a New Home 🌬️</h1>
    <p>PAPTrack is now its own app at<br>
      <a href="https://eagleadams86.github.io/paptrack/">eagleadams86.github.io/paptrack</a>.</p>
    <p>Redirecting you now — update your bookmark if it doesn't.</p>
  </div>
</body>
</html>
